# Dresden moonlight with the same violet / magenta language as Hyprland,
# Waybar (Catppuccin Mocha), and SwayNC.

$violet = rgb(d580ff)
$lavender = rgb(cba6f7)
$text = rgb(cdd6f4)
$muted = rgb(a6adc8)
$field_fill = rgba(11111bc9)
$field_border = rgba(d580ffb8)

background {
    monitor =
    path = ~/.config/hypr/view_of_dresden_by_moonlight.jpg
    blur_size = 0
    blur_passes = 0
    noise = 0.006
    contrast = 1.12
    brightness = 0.88
    vibrancy = 0.14
    vibrancy_darkness = 0.03
}

# Tahoe-style upper-third clock: a small date above one horizontal time line.
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date '+%a, %d %b')</b>"
    color = $text
    font_size = 22
    font_family = Geist Mono Nerd Font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0000008c)
    position = 0, 470
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $violet
    font_size = 104
    font_family = Geist Mono Nerd Font
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(000000a6)
    position = 0, 370
    halign = center
    valign = center
}

# Tahoe-inspired: a modest, persistent password pill near the bottom edge.
# fade_on_empty is deliberately disabled so the control remains discoverable.
input-field {
    monitor =
    size = 210, 42
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.42
    dots_center = true
    dots_rounding = -1
    rounding = 21
    outer_color = $field_border
    inner_color = $field_fill
    font_color = $text
    check_color = $lavender
    fail_color = rgb(f38ba8)
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    hide_input = false
    position = 0, -550
    halign = center
    valign = center
}
