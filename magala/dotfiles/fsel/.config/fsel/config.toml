# Run terminal-only desktop entries in the terminal used by this Hyprland setup.
terminal_launcher = "kitty -e"

[app_launcher]
# Limit results to applications intended for the current desktop session.
filter_desktop = true
# Hide secondary desktop actions such as "New Window" to keep the list compact.
filter_actions = true
# Keep only one entry for applications advertised by multiple desktop files.
auto_hide_duplicates = true
match_mode = "fuzzy"
ranking_mode = "frecency"
